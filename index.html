document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nter; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); y-content:flex-end\">\n      <a href=\"#now\" style=\"font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#1d1d2d\" style-hover=\"color:#5d5d86\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Τώρα<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Now<\u002Fsc-if><\u002Fa>\n      <a href=\"#timeline\" style=\"font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#1d1d2d\" style-hover=\"color:#5d5d86\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Πορεία<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Journey<\u002Fsc-if><\u002Fa>\n      <a href=\"#music\" style=\"font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#1d1d2d\" style-hover=\"color:#5d5d86\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Δισκογραφία<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Releases<\u002Fsc-if><\u002Fa>\n      <a href=\"#video\" style=\"font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#1d1d2d\" style-hover=\"color:#5d5d86\">Video<\u002Fa>\n      <a href=\"#media\" style=\"font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#1d1d2d\" style-hover=\"color:#5d5d86\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Media<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Media<\u002Fsc-if><\u002Fa>\n      <a href=\"#gallery\" style=\"font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#1d1d2d\" style-hover=\"color:#5d5d86\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Φωτογραφίες<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Photos<\u002Fsc-if><\u002Fa>\n      <a href=\"#bio\" style=\"font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#1d1d2d\" style-hover=\"color:#5d5d86\">Bio<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"padding:0 0 clamp(20px,3vw,40px)\">\n    <h1 style=\"position:relative;margin:0;display:block;background:#181a21\">\n      <img src=\"assets/photos/hero-top.jpg\" alt=\"Phil Diamond\" style=\"display:block;width:100%;height:clamp(420px,72vh,820px);object-fit:cover;object-position:50% 28%\">\n      <span style=\"position:absolute;left:0;right:0;bottom:0;padding:clamp(20px,4vw,44px) clamp(16px,4vw,56px);background:linear-gradient(to top,#181a21 0%,rgba(24,26,33,.92) 55%,rgba(24,26,33,0) 100%);display:block\">\n      <span style=\"width:34%;max-width:420px;min-width:160px;display:block\">\n        <img src=\"e9aebab9-f49d-49f3-a1e5-38fe78484f01\" alt=\"Phil Diamond\" style=\"display:block;width:100%;height:auto\">\n      <\u002Fspan>\n      <\u002Fspan>\n    <\u002Fh1>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(20px,3.5vw,52px);align-items:end;padding:clamp(24px,3.5vw,44px) clamp(16px,4vw,56px) 0\">\n      <div>\n        <span style=\"display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#6d6d92;margin-bottom:18px\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Τραγουδιστής · Τραγουδοποιός<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Singer · Songwriter<\u002Fsc-if><\u002Fspan>\n        <p style=\"font-size:clamp(19px,1.7vw,26px);line-height:1.45;max-width:40ch;margin:0;color:#1d1d2d\">\n          <sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Μία φωνή, δύο γλώσσες, δεκαεπτά χρόνια δρόμος — από το Ευηνοχώρι και τη Θεσσαλονίκη στο Λονδίνο, την Αθήνα και το Λος Άντζελες. Και τώρα, πίσω στα ελληνικά.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">One voice, two languages, seventeen years on the road — from Evinochori and Thessaloniki to London, Athens and Los Angeles. And now, back in Greek.<\u002Fsc-if>\n        <\u002Fp>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin:30px 0 0\">\n          <a class=\"btn btn-primary\" href=\"https://orcd.co/phil_diamond_paidi_sti_mesi_tou_panigyriou\" target=\"_blank\" rel=\"noopener\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Άκου τον νέο δίσκο<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Hear the new album<\u002Fsc-if><\u002Fa>\n          <a class=\"btn btn-secondary\" href=\"#timeline\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Η πορεία<\u002Fsc-if><sc-if value=\"{{ isEn }}\">The journey<\u002Fsc-if><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"now\" class=\"rv\" style=\"margin:clamp(40px,5vw,72px) 0 0;background:#181a21;color:#fafafa;padding:clamp(28px,4.5vw,68px) clamp(16px,4vw,56px)\">\n    <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid #3a3a4d;padding-bottom:18px;margin-bottom:clamp(24px,3.5vw,44px)\">\n      <span style=\"font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#8a8ab1\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Τώρα<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Now<\u002Fsc-if><\u002Fspan>\n      <span style=\"font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:#a3a5aa\">16.07.2026 · Διανομή Stay Independent<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"g2\" style=\"gap:clamp(22px,3.5vw,52px);align-items:start\">\n      <div style=\"max-width:380px\">\n        <img src=\"assets/photos/album-paidi.png\" alt=\"Παιδί στη μέση του πανηγυριού\" style=\"display:block;width:100%;height:auto\">\n        <a class=\"btn btn-light btn-block\" href=\"https://orcd.co/phil_diamond_paidi_sti_mesi_tou_panigyriou\" target=\"_blank\" rel=\"noopener\" style=\"margin-top:12px\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Άκουσέ τον<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Listen<\u002Fsc-if><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"min-width:0\">\n        <h2 style=\"font-weight:800;font-size:clamp(32px,4.4vw,64px);line-height:1;letter-spacing:-.03em;margin:0\">Παιδί στη μέση<br>του πανηγυριού<\u002Fh2>\n        <p style=\"font-size:clamp(17px,1.25vw,20px);line-height:1.6;max-width:52ch;margin:22px 0 0;color:#d6d6e0\">\n          <sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">7 κομματια. 2 Ονειρα, 2 κομματια ερωτα,πικρας,αγαπης 1 κομματι για τα χρονια της αγιας παρασκευης και 2 κομματια για την ψυχη και το νου.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">The first solo album. Seven songs in Greek: two dreams, two songs of love, bitterness and affection, one for the years in Agia Paraskevi, and two for the soul and the mind.<\u002Fsc-if>\n        <\u002Fp>\n        <button class=\"btn btn-ghost-light\" type=\"button\" sc-camel-on-click=\"{{ toggleStory }}\" style=\"margin-top:26px\">\n          <sc-if value=\"{{ sOpenEl }}\">Κλείσε την ιστορία ↑<\u002Fsc-if><sc-if value=\"{{ sShutEl }}\" hint-placeholder-val=\"{{ true }}\">Η ιστορία του δίσκου ↓<\u002Fsc-if><sc-if value=\"{{ sOpenEn }}\">Close the story ↑<\u002Fsc-if><sc-if value=\"{{ sShutEn }}\">The story of the album ↓<\u002Fsc-if>\n        <\u002Fbutton>\n        <div style=\"{{ storyStyle }}\">\n          <div style=\"border-top:1px solid #3a3a4d;margin-top:22px;padding-top:22px;max-width:60ch;font-size:17px;line-height:1.72;color:#d6d6e0\">\n            <sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">\n              <p style=\"margin:0 0 17px\">Τον Ιούλιο του 2024, εν μέσω συναισθηματικών καταιγίδων και τρικυμιών, βρέθηκα στα Κοτσιανά Κρήτης, στο στούντιο Landmine του Γιώργου Σκανδαλάκη. Ήθελα να γράψω ένα δίσκο στα ελληνικά, ήταν μια βαθύτερη ανάγκη και μια πρόκληση να αποδώσω τα συναισθήματά μου και τις σκέψεις μου σε στίχους στη γλώσσα μου. Τέλη Αυγούστου, αφού τελείωσα 7 κομμάτια, κάλεσα τον Τομ Γιόσι με την πρόφαση των διακοπών, όπου και τον έκλεισα για 5 μέρες σε ένα δωμάτιο για να γράψουμε τους οδηγούς - μόνο φωνή και δομή είχε ο Τομ να δουλέψει, και με τη βοήθεια του Γιώργου ο σκελετός ήταν έτοιμος.<\u002Fp>\n              <p style=\"margin:0 0 17px\">Οι μήνες πέρασαν, δουλέψαμε μαζί με τον Ανδρέα Καρρά και τον Νίκο Μαρτζιώκα πάνω σε ρυθμούς, γκρουβς, και κάλεσε και τον Γιώργο τον Κωνσταντίνου να γράψει μπάσο, να δέσει το σώμα των κομματιών. Μαζί στην πορεία αυτή και ο Νικόλας Wastor. Προπαραγωγές σε σπίτια, παίχτες υψηλού επιπέδου, μείγμα από ελληνικούς ρυθμούς, ρυθμούς της Αφρικής και της νότιου Αμερικής, και να ο δίσκος ήταν έτοιμος να ηχογραφηθεί.<\u002Fp>\n              <p style=\"margin:0 0 17px\">Πήγαμε και στο Μεσολόγγι. Εγώ, ο Γιώργης και ο Mike - ηχογράφηση με τον βιρτουόζο της πίπιζας ή ζούρνας Ηλία Κακαρούκα - πώς θα μπορούσαν να λείπουν και ο Αη-Συμιός και ο Αη-Γιάννης και τα πανηγύρια τα καλοκαιρινά από όλο αυτό;<\u002Fp>\n              <p style=\"margin:0 0 17px\">Μπήκαμε στο Dudu loft, έγραψε το rhythm section live, ήταν ονειρικό. Ο Δημήτρης ο Καλαμαράς με τον Γιώργο τον Κραββαρίτη στην ηχοληψία, ο Γιώργος ο Μπότης εκεί μαζί να δουλεύουμε και να βγάλουμε όσο πιο πολύ το live συναίσθημα.<\u002Fp>\n              <p style=\"margin:0 0 17px\">Συνέχεια μετά, φωνητικά στον Εισβολέα, φωνητικά στην Κορυδαλλέως, η Θάλεια, η σοφία η καμίνα, η σουγκασπάνκ. Ο δίσκος ετοιμάστηκε, τα στοιχεία ήταν εκεί, οι στίχοι γράφτηκαν, η μίξη έγινε out of the box στο 144 στην Ηλιούπολη, στο Μιχάλη το Σκαράκη. Και να που τον Ιούλιο του 2026, στις 16, αποφασίστηκε η κυκλοφορία μαζί με την Stay Independent.<\u002Fp>\n              <p style=\"margin:0 0 17px\">Όσα και να προσπαθήσω να γράψω και να πω για αυτό τον δίσκο, είναι ο πρώτος μου δίσκος.<\u002Fp>\n              <p style=\"margin:0 0 17px\">Τα κατάφερα, μίλησα στη γλώσσα μου, κοκκινισμένος από ντροπή και αμηχανία, τη ντροπή του παιδιού που δειλά ψελλίζει την ψυχή του, μετά ξαναλέει, φωνάζει για να το ακούσουν.<\u002Fp>\n              <p style=\"margin:0 0 17px;white-space:pre-line\">7 κομμάτια.\n2 Όνειρα,\n2 κομμάτια έρωτα, πίκρας, αγάπης,\n1 κομμάτι για τα χρόνια της Αγίας Παρασκευής\nκαι 2 κομμάτια για την ψυχή και το νου.\nΤώρα είναι εκεί έξω, τώρα δεν υπάρχει γυρισμός.\nPhil Diamond, Man Called Shadow, Adámas, The Bet, Travel Mind Syndrome.\n17 χρόνια και άλλα τόσα πιο πριν.\nΠαιδί στη μέση πανηγυριού.<\u002Fp>\n              <p style=\"margin:26px 0 0;white-space:pre-line;font-size:clamp(19px,1.7vw,25px);line-height:1.35;color:#fff\">Άσπρος\nήλιος\nκαλοκαιρινός\nΜαύρος\nήλιος\nχειμωνιάτικος<\u002Fp>\n            <\u002Fsc-if>          <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:26px;margin:clamp(26px,3.5vw,40px) 0 0;border-top:1px solid #3a3a4d;padding-top:24px\">\n          <div>\n            <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a8ab1;margin-bottom:12px\">Tracklist<\u002Fspan>\n            <ol style=\"margin:0;padding:0;list-style:none;font-size:16px;line-height:1.95;color:#d6d6e0\">\n              <li>1 · Όνειρο pt1<\u002Fli>\n              <li>2 · Κολόμπο<\u002Fli>\n              <li>3 · Έλα κοντά μου<\u002Fli>\n              <li style=\"color:#fff;font-weight:700\">4 · Τι σου 'κανα <span style=\"font-weight:400;color:#a3a5aa\">ft. Sugahspank<\u002Fspan><\u002Fli>\n              <li>5 · Τι ζητάς<\u002Fli>\n              <li>6 · Θυμήσου<\u002Fli>\n              <li>7 · Όνειρο pt2<\u002Fli>\n            <\u002Fol>\n          <\u002Fdiv>\n          <div>\n            <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a8ab1;margin-bottom:12px\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Ηχογραφήθηκε<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Recorded at<\u002Fsc-if><\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7;color:#d6d6e0\">Landmine Studios, Κοτσιανά, Κρήτη<br>Dudu Loft, Αθήνα<br>Ξενοδοχείον Κορυδαλλέως<br>133 Studio, Ηλιούπολη<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a8ab1;margin-bottom:12px\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Συντελεστές<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Credits<\u002Fsc-if><\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7;color:#d6d6e0\">Μουσική: Phil Diamond<br>Παραγωγή: Phil Diamond, Γιώργος Σκανδαλάκης<br>Ενορχήστρωση: Phil Diamond &amp; Band<br>Ενορχήστρωση εγχόρδων: Δανδουλάκης Αλέξανδρος<br>Publishing: yellowgroove<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"btn btn-ghost-light\" type=\"button\" sc-camel-on-click=\"{{ toggleCredits }}\" style=\"margin-top:26px\">\n          <sc-if value=\"{{ cOpen }}\">Κλείσε τους συντελεστές ↑<\u002Fsc-if><sc-if value=\"{{ cShut }}\" hint-placeholder-val=\"{{ true }}\">Όλοι οι συντελεστές ↓<\u002Fsc-if>\n        <\u002Fbutton>\n        <div style=\"{{ creditsStyle }}\">\n        <div style=\"border-top:1px solid #3a3a4d;margin-top:24px;padding-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:26px\">\n          <div>\n            <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a8ab1;margin-bottom:12px\">Μουσικοί<\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7;color:#d6d6e0\">Phil Diamond — φωνή, κιθάρα<br>Tom Yosi — κιθάρα<br>Γιώργος Κωνσταντίνου — μπάσο<br>Αντρέας Καρράς — τύμπανα<br>Νικόλας Wastor — πλήκτρα<br>Νίκος Μαρτζιώκας — κρουστά<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a8ab1;margin-bottom:12px\">Φωνητικά &amp; παράδοση<\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7;color:#d6d6e0\">Σοφία Καμηνά — φωνητικά<br>Thaliah — φωνητικά<br>Sugahspank — φωνητικά<br>Γιώργος Σκανδαλάκης — φωνητικά<br>Ηλίας «Κακαρούκας» Αριστόπουλος — φλογέρα<br>Κώστας Μπέκος — νταούλι<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a8ab1;margin-bottom:12px\">Έγχορδα<\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7;color:#d6d6e0\">Τάσος Γουσέτης — 1ο βιολί<br>Κατερίνα Τεπελένα — 2ο βιολί<br>Μαρίνα Σταλήμερου — βιόλα<br>Σταύρος Παργινός — βιολοντσέλο<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a8ab1;margin-bottom:12px\">Στίχοι<\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7;color:#d6d6e0\">Phil Diamond — Όνειρο pt1, Κολόμπο, Τι σου ’κανα, Τι ζητάς<br>Phil Diamond, Γεωργία Δρακάκη — Έλα κοντά μου, Όνειρο pt2<br>Phil Diamond, Tom Yosi — Θυμήσου<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a8ab1;margin-bottom:12px\">Ηχοληψία &amp; μίξη<\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7;color:#d6d6e0\">Mixed &amp; mastered — Γιώργος Μπότης, 133 Studio, Ηλιούπολη<br>Engineers — Δημήτρης Καλαμαράς, Γιώργος Κραββαρίτης, Μιχάλης Σκαράκης<br>Τα lead vocals ηχογραφήθηκαν στο studio του Εισβολέα<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a8ab1;margin-bottom:12px\">Ευχαριστίες<\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.7;color:#d6d6e0\">Φωτογραφία εξωφύλλου: Άλκης Λαγόπουλος<br>Γεωργία Δρακάκη, Σύλλογος Πανηγυριστών «Ο Άη Συμιός», Δήμος Ι.Π. Μεσολογγίου, Εισβολέας, Μιχάλης Κωνσταντέλλης, Μιχάλης Σκαράκης<br><span style=\"color:#fff\">…Για τη Γεωργία<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"timeline\" style=\"padding:clamp(44px,6vw,96px) clamp(16px,4vw,56px) clamp(28px,4vw,56px)\">\n    <div class=\"rv\" style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid #1d1d2d;padding-bottom:16px\">\n      <h2 style=\"font-weight:800;font-size:clamp(30px,3.6vw,52px);line-height:1;letter-spacing:-.025em;margin:0;text-transform:uppercase\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Η πορεία<\u002Fsc-if><sc-if value=\"{{ isEn }}\">The journey<\u002Fsc-if><\u002Fh2>\n      <span style=\"font-size:13px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#6d6d92\">2009 — 2026<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"rv\" style=\"max-width:60ch;font-size:clamp(17px,1.4vw,21px);line-height:1.65;color:#1d1d2d;padding:clamp(22px,3vw,36px) 0 0\">\n      <p style=\"margin:0 0 14px\">Θεσσαλονίκη, Λονδίνο, Αθήνα, Λος Άντζελες, Κρήτη.<\u002Fp>\n      <p style=\"margin:0 0 14px\">Travel Mind Syndrome, The Bet, Echo Train, The Blue Square, Adámas, Orgone, Kid Moxie, Buzzhound, Man Called Shadow — και τώρα «Παιδί στη μέση πανηγυριού».<\u002Fp>\n      <p style=\"margin:0\">17 χρονια και αλλα τοσα πιο πριν.<\u002Fp>\n    <\u002Fdiv>\n    <button class=\"btn btn-ghost-ink\" type=\"button\" sc-camel-on-click=\"{{ tl }}\" style=\"margin-top:10px\"><sc-if value=\"{{ tlOn }}\">Κλείσε την πορεία ↑<\u002Fsc-if><sc-if value=\"{{ tlOff }}\" hint-placeholder-val=\"{{ true }}\">Δες αναλυτικά την πορεία ↓<\u002Fsc-if><\u002Fbutton>\n    <div style=\"{{ tlStyle }}\"><sc-for list=\"{{ chaptersRev }}\" as=\"c\">\n      <article class=\"rv g3\" style=\"gap:clamp(18px,3vw,44px);padding:clamp(26px,3.5vw,48px) 0;border-bottom:1px solid #d3d3dd;align-items:start\">\n        <div class=\"tlyear\" style=\"position:sticky;top:76px;align-self:start\">\n          <span style=\"display:block;font-weight:800;font-si 6e6ec;aspect-ratio:1/1\">\n          <img class=\"gs\" src=\"{{ g.src }}\" alt=\"{{ g.cap }}\" title=\"{{ g.cap }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\" style-hover=\"transform:scale(1.04)\">\n        <\u002Ffigure>\n      <\u002Fsc-for><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"bio\" style=\"padding:clamp(28px,4vw,56px) clamp(16px,4vw,56px) clamp(44px,6vw,88px)\">\n    <div class=\"rv\" style=\"border-bottom:2px solid #1d1d2d;padding-bottom:16px;margin-bottom:clamp(22px,3vw,36px)\">\n      <h2 style=\"font-weight:800;font-size:clamp(30px,3.6vw,52px);line-height:1;letter-spacing:-.025em;margin:0;text-transform:uppercase\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Βιογραφικό<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Biography<\u002Fsc-if><\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"rv\" style=\"max-width:66ch;font-size:18px;line-height:1.75;color:#3f485d\">\n      <sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"margin:0 0 20px;font-size:21px;color:#1d1d2d\">Ο Phil Diamond (Φίλιππος Διαμαντόπουλος) αποτελεί μία από τις πιο ξεχωριστές και ευέλικτες φωνές της σύγχρονης εγχώριας και διεθνούς μουσικής σκηνής. Μεγαλώνοντας στο Ευηνοχώρι Αιτωλοακαρνανίας με τους παραδοσιακούς ήχους της υπαίθρου, αλλά και την αφρικανική διασπορά, τη soul και την εκρηκτική ενέργεια του rock ‘n’ roll, η συνδετική αλυσίδα σε όλη την καλλιτεχνική του πορεία υπήρξε πάντα η ίδια: μια χαρισματική, καθηλωτική φωνή με σπάνιο εκφραστικό εύρος, ικανή να μεταφέρει την ίδια αυθεντικότητα είτε ερμηνεύει αγγλόφωνο rock και soul, είτε βουτάει στις βαθύτερες ρίζες της ελληνικής παράδοσης.<\u002Fp>\n        <button class=\"btn btn-ghost-ink\" type=\"button\" sc-camel-on-click=\"{{ bio }}\" style=\"margin:10px 0 0\"><sc-if value=\"{{ bioOn }}\">Κλείσε το βιογραφικό ↑<\u002Fsc-if><sc-if value=\"{{ bioOff }}\" hint-placeholder-val=\"{{ true }}\">Διάβασε όλο το βιογραφικό ↓<\u002Fsc-if><\u002Fbutton>\n        <div style=\"{{ bioStyle }}\"><div style=\"padding-top:20px\">\n        <p style=\"margin:0 0 20px\">Η μουσική του διαδρομή ξεκίνησε στα 17 του με την κιθάρα και το τραγούδι, για να εξελιχθεί μέσα από τα μεγάλα πολιτιστικά αστικά κέντρα — τη Θεσσαλονίκη, το Λονδίνο και την Αθήνα.<\u002Fp>\n        <p style=\"margin:0 0 20px\">Η πρώτη μεγάλη επιβεβαίωση ήρθε ως frontman των indie rockers Travel Mind Syndrome. Με το τραγούδι «Breeze of Light» να κερδίζει τη διάκριση Song of the Month στον θεσμό Jumping Fish της Cosmote, η μπάντα κατέκτησε αμέσως τους σημαντικότερους ραδιοφωνικούς σταθμούς της χώρας. Ακολούθησαν τηλεοπτικές εμφανίσεις (Mad TV, ΕΡΤ) και μια σειρά από σημαντικά live, όπως το άνοιγμα των συναυλιών για τους Sivert Høyem (Madrugada) και Ojos de Brujo στο Fuzz Club, τους The Radio Dept. στο Gagarin 205, αλλά και τη συμμετοχή τους στους τελικούς του Jumping Fish-Bon Jovi Contest και στην Ευρωπαϊκή Γιορτή Μουσικής.<\u002Fp>\n        <p style=\"margin:0 0 20px\">Χωρίς να περιορίζει την ερμηνευτική του παλέτα, στη συνέχεια ηγήθηκε των The Bet, ενός εκρηκτικού soul/funk/rock σχήματος. Με το single «The Message» και το EP In Motion, οι The Bet βρέθηκαν σταθερά στη Hot List και τα 525 Live Sessions του En Lefko 87.7, κάνοντας ζωντανές ακουστικές εμφανίσεις στο Rock FM 96.9. Η φωνή και η σκηνική παρουσία του Phil Diamond σφράγισαν το μεγάλο πανελλαδικό καλοκαιρινό τουρνέ Sol ’n Roll (με χορηγία της Heineken/Athenian Brewery), ενώ οι The Bet επιλέχθηκαν για να ανοίξουν τις sold-out εμφανίσεις σπουδαίων διεθνών ονομάτων στο Gazarte, όπως οι Monophonics και οι The Soul Jazz Orchestra, καθώς και των Radio Moscow στο Six D.O.G.S. Παράλληλα, η συμμετοχή του ως βασικός ερμηνευτής στο χριστουγεννιάτικο μιούζικαλ SAVIOUR της Όλγας Εμμανουήλ απέδειξε την άνεσή του σε απαιτητικές θεατρικές και συμφωνικές φόρμες.<\u002Fp>\n        <p style=\"margin:0 0 20px\">Η μετοίκησή του στο Λος Άντζελες αποτέλεσε τον απόλυτο καταλύτη για τη διεθνή του εξέλιξη. Εκεί, η φωνή του λειτούργησε ως γέφυρα ανάμεσα σε διαφορετικές κουλτούρες. Συνεργάστηκε με κορυφαίους μουσικούς της West Coast σκηνής — όπως μέλη των Jungle Fire, Orgone, The Monophonics, Tribe of Gypsies, καθώς και με τον παραγωγό Roy Z και την Kid Moxie — δημιουργώντας το σχήμα Adámas. Παράλληλα, συμμετείχε σε project των The Blue Square.<\u002Fp>\n        <p style=\"margin:0 0 20px\">Διατηρώντας αδιάλειπτη τη μουσική του παρουσία και παραμένοντας δημιουργικά ενεργός στο προσκήνιο, ξεχώρισε επίσης ως βασικός ερμηνευτής στο κινηματογραφικό/vintage soul project Man Called Shadow. Κατά την περίοδο 2022–2023, τα τραγούδια του σχήματος γνώρισαν εκτεταμένο ραδιοφωνικό airplay στους σημαντικότερους σταθμούς της χώρας (Pepper 96.6, Nostos 100.6, En Lefko 87.7), ενώ η φωνητική του παρουσία ταξίδεψε ευρύτερα στο ευρύ κοινό όταν ερμήνευσε το «Wildflower» για το soundtrack της επιτυχημένης δραματικής σειράς της ΕΡΤ1, «Η Παραλία».<\u002Fp>\n        <p style=\"margin:0 0 20px\">Αυτή η πλούσια αγγλόφωνη διαδρομή, γεμάτη από βιώματα, διεθνείς συνεργασίες και τηλεοπτικές/ραδιοφωνικές επιτυχίες, ήταν η προετοιμασία για την επιστροφή στις καταβολές του. Ο Phil Diamond αξιοποίησε τη φωνητική του ωριμότητα για να συνδέσει οργανικά το αγγλόφωνο rock/soul songwriting με το ελληνικό υπόβαθρο.<\u002Fp>\n        <p style=\"margin:0 0 20px\">Η κορύφωση αυτής της οργανικής εξέλιξης αποτυπώνεται στο προσωπικό του άλμπουμ, «Παιδί Στη Μέση Του Πανηγυριού». Η δουλειά αυτή λειτουργεί ως μια διαπολιτισμική γέφυρα: ο κιθαριστικός λυρισμός, η ψυχεδέλεια και το rock συναίσθημα που κουβαλάει η φωνή του από τα χρόνια του Λονδίνου και του Λος Άντζελες μπολιάζονται με τους δωρικούς ρυθμούς της ελληνικής παράδοσης.<\u002Fp>\n        <p style=\"margin:0 0 0\">Είτε τραγουδάει στα αγγλικά σε ένα club του Λος Άντζελες, είτε ερμηνεύει το «Wildflower» για μια τηλεοπτική παραγωγή, είτε ερμηνεύει ελληνικό στίχο σε μια αθηναϊκή σκηνή, η φωνή του Phil Diamond παραμένει το κοινό, αδιαμφισβήτητο σημείο αναφοράς: μια φωνή γεμάτη αλήθεια, ψυχή και μια αδιάκοπη καλλιτεχνική συνέπεια που ξεπερνά σύνορα και μουσικά είδη.<\u002Fp>\n<\u002Fdiv><\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#181a21;color:#a3a5aa;padding:clamp(32px,4.5vw,64px) clamp(16px,4vw,56px)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:clamp(24px,4vw,56px);align-items:start;border-bottom:1px solid #3a3a4d;padding-bottom:clamp(28px,4vw,44px)\">\n      <div>\n        <img src=\"e9aebab9-f49d-49f3-a1e5-38fe78484f01\" alt=\"Phil Diamond\" style=\"height:34px;width:auto;display:block;margin-bottom:18px\">\n        <p style=\"margin:0;font-size:16px;line-height:1.6;max-width:32ch\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Νέα για κυκλοφορίες και ζωντανές εμφανίσεις — χωρίς θόρυβο.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">News on releases and live dates — no noise.<\u002Fsc-if><\u002Fp>\n        <form sc-camel-on-submit=\"{{ onSubscribe }}\" style=\"display:flex;gap:0;margin-top:18px;max-width:380px\">\n          <input class=\"input\" type=\"email\" required=\"\" name=\"email\" placeholder=\"{{ mailPlaceholder }}\" style=\"flex:1;min-width:0;background:#22242e;border-color:#3a3a4d;color:#fafafa\">\n          <button class=\"btn btn-light btn-compact\" type=\"submit\">OK<\u002Fbutton>\n        <\u002Fform>\n        <p style=\"margin:10px 0 0;font-size:14px;color:#8a8ab1\">{{ mailNote }}<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#fff;margin-bottom:14px\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Ακολούθησε<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Follow<\u002Fsc-if><\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:16px\">\n          <a href=\"https://open.spotify.com/artist/4WSgdoT2ZHBQrsDIBFFk9j\" target=\"_blank\" rel=\"noopener\" style=\"color:#a3a5aa\" style-hover=\"color:#fff\">Spotify →<\u002Fa>\n          <a href=\"https://www.youtube.com/@PhilDiamondSongs\" target=\"_blank\" rel=\"noopener\" style=\"color:#a3a5aa\" style-hover=\"color:#fff\">YouTube →<\u002Fa>\n          <a href=\"https://www.instagram.com/therealphildiamond/\" target=\"_blank\" rel=\"noopener\" style=\"color:#a3a5aa\" style-hover=\"color:#fff\">Instagram →<\u002Fa>\n          <a href=\"https://www.facebook.com/phildiamondmusic\" target=\"_blank\" rel=\"noopener\" style=\"color:#a3a5aa\" style-hover=\"color:#fff\">Facebook →<\u002Fa>\n          <a href=\"https://adamasmusic.bandcamp.com\" target=\"_blank\" rel=\"noopener\" style=\"color:#a3a5aa\" style-hover=\"color:#fff\">Bandcamp →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <span style=\"display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#fff;margin-bottom:14px\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Επικοινωνία<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Contact<\u002Fsc-if><\u002Fspan>\n        <p style=\"margin:0;font-size:16px;line-height:1.7\"><sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Bookings, press, συνεργασίες<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Bookings, press, collaborations<\u002Fsc-if><br><a href=\"mailto:info@phildiamondmusic.com\" style=\"color:#fff\">info@phildiamondmusic.com<\u002Fa><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:22px 0 0;font-size:14px;letter-spacing:.06em\">© 2026 Phil Diamond · <sc-if value=\"{{ isEl }}\" hint-placeholder-val=\"{{ true }}\">Όλα τα δικαιώματα διατηρούνται<\u002Fsc-if><sc-if value=\"{{ isEn }}\">All rights reserved<\u002Fsc-if><\u002Fp>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { lang: 'el', story: false, mailed: false };\n\n  componentDidMount() {\n    const io = new IntersectionObserver((es) => {\n      es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });\n    }, { rootMargin: '0px 0px -8% 0px', threshold: 0 });\n    const attach = () => document.querySelectorAll('.rv:not(.in)').forEach(el => io.observe(el));\n    attach();\n    this._mo = new MutationObserver(attach);\n    this._mo.observe(document.body, { childList: true, subtree: true });\n    this._io = io;\n  }\n  componentWillUnmount() { if (this._mo) this._mo.disconnect(); if (this._io) this._io.disconnect(); }\n\n  renderVals() {\n    const el = this.state.lang === 'el';\n    const tab = (on) => `background:${on ? '#1d1d2d' : 'transparent'};border:0;color:${on ? '#fafafa' : '#1d1d2d'};font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.09em;padding:7px 11px;cursor:pointer`;\n\n    const chapters = el ? [\n      { years: '2009—2012', place: 'Θεσσαλονίκη · Αθήνα', title: 'Travel Mind Syndrome', tint: '#1d1d2d',\n        body: 'Η πρώτη μεγάλη επιβεβαίωση, ως frontman των indie rockers Travel Mind Syndrome. Το «Breeze of Light» κέρδισε τη διάκριση Song of the Month στον θεσμό Jumping Fish της Cosmote και η μπάντα κατέκτησε αμέσως τους σημαντικότερους ραδιοφωνικούς σταθμούς της χώρας.',\n        facts: ['EP «East Acton To Saint Friday» — release party στο Hoxton, 2010', 'Άνοιγμα για Sivert Høyem (Madrugada) και Ojos de Brujo στο Fuzz Club', 'The Radio Dept. στο Gagarin 205 · Caesars στο Κύτταρο', 'Χορηγίες Cosmote και JCB για το video «Breeze of Light»', 'Τηλεοπτικές εμφανίσεις: Mad TV, ΕΡΤ'],\n        photo: 'assets/photos/tl-tms-live.jpg' },\n      { years: '2010—2015', place: 'Αθήνα', title: 'The Bet', tint: '#1d1d2d',\n        body: 'Χωρίς να περιορίζει την ερμηνευτική του παλέτα, ηγήθηκε των The Bet, ενός εκρηκτικού soul/funk/rock σχήματος. Με το single «The Message» και το EP In Motion βρέθηκαν σταθερά στη Hot List και τα 525 Live Sessions του En Lefko 87.7.',\n        facts: ['EP «In Motion» (Restless Wind) — το πιο κατεβασμένο άλμπουμ στο CD Baby για την Ελλάδα, Σεπτέμβριος 2012', 'Single «Who\\u2019ll Pay Reparations On My Soul» — Gil Scott-Heron', 'Πάνω από 70 ζωντανές εμφανίσεις μέσα σε έναν χρόνο', 'Πανελλαδικό καλοκαιρινό τουρνέ Sol \\u2019n Roll (Heineken / Athenian Brewery)', 'Άνοιγμα για Monophonics και The Soul Jazz Orchestra στο Gazarte', 'Radio Moscow στο Six D.O.G.S. · Let Me Know! Festival 2013', 'Φωνή στο Countdown To Led Zeppelin — Fuzz Club, Απρίλιος 2015'],\n        photo: 'assets/photos/tl-thebet-live.jpg' },\n      { years: '2015—2019', place: 'Los Angeles', title: 'Adámas', tint: '#1d1d2d',\n        body: 'Η μετοίκηση στο Λος Άντζελες ήταν ο απόλυτος καταλύτης. Η φωνή του λειτούργησε ως γέφυρα ανάμεσα σε κουλτούρες, σε συνεργασία με μουσικούς της West Coast σκηνής — και από αυτό γεννήθηκε το σχήμα Adámas.',\n        facts: ['Συνεργασίες: Roy Z, Jungle Fire, Orgone, The Monophonics, Tribe of Gypsies, Kid Moxie', 'Η παραγωγή των Adámas έγινε συλλογικά, από την μπάντα', 'Live: The Echoplex, Los Globos, Mrs Fish'],\n        photo: 'assets/photos/tl-adamas-live.jpg' },\n      { years: '2019—2022', place: 'Los Angeles · Αθήνα', title: 'Buzzhound · The Blue Square · Kid Moxie', tint: '#1d1d2d',\n        body: 'Παράλληλες συνεργασίες και studio project και στις δύο ακτές του Ατλαντικού, με τη φωνή να κινείται ελεύθερα ανάμεσα σε soul, psych, hard rock και κινηματογραφικούς ήχους.',\n        facts: ['Buzzhound — EP «Hunting The Buzz» σε βινύλιο, Ιανουάριος 2022', 'Live review στο Metal Hammer, Ιούνιος 2022 (τεύχος 450)', 'Buzzhound live στο Six D.O.G.S. και στο Eightball', 'The Blue Square LP — Melting Records', 'Kid Moxie — «Not To Be Unpleasant But We Need To Have A Serious Talk» O.S.T.'],\n        photo: 'assets/photos/tl-buzzhound-live.jpg' },\n      { years: '2021—2023', place: 'Αθήνα', title: 'Man Called Shadow', tint: '#1d1d2d',\n        body: 'Ξεχώρισε ως βασικός ερμηνευτής στο κινηματογραφικό/vintage soul project Man Called Shadow. Τα τραγούδια
